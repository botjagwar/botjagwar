name: Page check fix agent

on:
  workflow_run:
    workflows: ["Page check issue agent"]
    types: [completed]
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: page-check-fix-agent
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent:queued' &&
       contains(github.event.issue.labels.*.name, 'page-check')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.PAGE_CHECK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: >-
          python -m pip install --disable-pip-version-check
          requests==2.34.2 charset-normalizer==3.5.1 idna==3.19
          urllib3==2.7.0 certifi==2026.7.22
      - name: Assign queued issues to the page-check fixer
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          PAGE_CHECKER_TOKEN: ${{ secrets.PAGE_CHECKER_TOKEN }}
          PAGE_CHECKER_URL: ${{ vars.PAGE_CHECKER_URL }}
          PAGE_CHECK_FIX_AGENT: ${{ vars.PAGE_CHECK_FIX_AGENT || 'page-check-fixer' }}
          PAGE_CHECK_FIX_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PAGE_CHECK_FIX_BATCH: ${{ vars.PAGE_CHECK_FIX_BATCH || '3' }}
          PAGE_CHECK_FIX_MODEL: ${{ vars.PAGE_CHECK_FIX_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            dispatch_args+=(--require-autonomous-agent-enabled)
          fi
          python scripts/page_check_agents.py dispatch "${dispatch_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
