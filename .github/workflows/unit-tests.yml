name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOTJAGWAR_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BOTJAGWAR_REQUIRE_POSTGRES_TESTS: "1"
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run backend tests
      run: SKIP_FRONTEND=1 bash -x test.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend
    - name: Lint frontend
      run: npm run lint
      working-directory: frontend
    - name: Test frontend
      run: npm test
      working-directory: frontend
    - name: Build frontend
      run: npm run build
      working-directory: frontend
