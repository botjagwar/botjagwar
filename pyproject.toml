[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name (existing codebase uses these)
    "F403",  # star imports (used in package __init__.py files)
    "F405",  # may be undefined from star import
    "E402",  # module import not at top of file (some scripts need this)
]

[tool.ruff.lint.per-file-ignores]
"old/*" = ["F821"]  # legacy files may have undefined names

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = false
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true

[tool.coverage.run]
omit = [
    "api/translation_v2/openmt.py",  # optional external MT integration, no offline tests
    "scripts/populate_definition_vectors.py",  # one-off data migration utility
    "scripts/populate_nllb_translation_vectors.py",  # one-off data migration utility
]
