# Copy this file to /etc/botjagwar/supervisor-control.ini on the Atlas host.
# Keep the resulting file mode 0600 because it contains remote Supervisor credentials.

[host:dictionary]
label = Dictionary backend
url = https://supervisor.dictionary.internal/RPC2
username = atlas-control
password = replace-with-a-random-password
timeout = 5
programs =
    dictionary_service_1,
    dictionary_service_2,
    entry_translator_1,
    postgrest_13
