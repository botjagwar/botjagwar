[global]
debug = true

# -- Replace that value with your mysql server
#database_uri=mysql+pymysql://test_user:test_password@localhost:3306/botjagwar

# --- Sqlite database files will, infortunately still be defined at class-level.
database_uri=sqlite:///
;database_uri=postgresql://test_user:test_password@localhost:5432/botjagwar
;database_uri=postgresql://test_user:test_password@192.0.2.10:25432/botjagwar
postgrest_backend_address = localhost:8100
deepseek_api_key = test-key
deepseek_model = deepseek-chat

[tenymalagasy]
mirror_url = http://127.0.0.1:8004
upstream_url = https://tenymalagasy.org
database_path = user_data/tenymalagasy_mirror.sqlite3

[redis]
host = 127.0.0.1
password =

[wikimedia]
requests_per_minute = 60
max_wait_seconds = 30
max_retries = 2
retry_wait_seconds = 1
retry_max_seconds = 5
maxlag_seconds = 5
socket_connect_timeout_seconds = 5
socket_read_timeout_seconds = 30
user_agent_description = Botjagwar offline test suite

[translator]
ninja_mode = 1

[openmt]
backend_address = http://localhost:8003

[nllb]
backend_address = http://localhost:8888
remaining_words_threshold = 2

[gemma]
api_url = http://127.0.0.1:8891/v1/chat/completions
model = gemma-4-e2b-it-q4-k-m
api_key =

[rabbitmq]
host = localhost
service = localhost
queue = edit
page_check_queue = translated
page_check_review_queue = page-check-review
gateway_replay_ledger = user_data/rabbitmq-gateway-replays.sqlite3
gateway_hmac_secret = test-only-gateway-hmac-secret-1234567890
username = botjagwar
password = password
virtual_host = botjagwar

[wiktionary_review]
environment_id = offline-test-suite
