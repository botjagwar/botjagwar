global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 15000
    timeout client 300000
    timeout server 300000

frontend translator_front
    bind 127.0.0.1:8890
    stats uri /translator?stats
    default_backend translator_back

backend translator_back
    balance roundrobin
    mode http
server translator1 127.0.0.1:8886 check
server translator2 127.0.0.1:8887 check
server translator3 127.0.0.1:8888 check

frontend dictionary_front
    bind 127.0.0.1:8001
    stats uri /dictionary?stats
    default_backend dictionary_back

backend dictionary_back
    balance leastconn
    mode http
server dictionary1 127.0.0.1:28001 check
server dictionary2 127.0.0.1:28002 check
server dictionary3 127.0.0.1:28003 check
server dictionary4 127.0.0.1:28004 check
server dictionary5 127.0.0.1:28005 check
server dictionary6 127.0.0.1:28006 check

frontend entry_translator_front
    bind 127.0.0.1:8000
    stats uri /entry_translator?stats
    default_backend entry_translator_back

backend entry_translator_back
    balance leastconn
    mode http
server entry_translator1 127.0.0.1:18001 check
server entry_translator2 127.0.0.1:18002 check
server entry_translator3 127.0.0.1:18003 check
server entry_translator4 127.0.0.1:18004 check
server entry_translator5 127.0.0.1:18005 check
server entry_translator6 127.0.0.1:18006 check
server entry_translator7 127.0.0.1:18007 check
server entry_translator8 127.0.0.1:18008 check
server entry_translator9 127.0.0.1:18009 check
server entry_translator10 127.0.0.1:18010 check

frontend pgrest_front
    bind 127.0.0.1:8100
    stats uri /pgrest?stats
    default_backend pgrest_back

backend pgrest_back
    balance roundrobin
    mode http
server pgrest1 127.0.0.1:8101 check
server pgrest2 127.0.0.1:8102 check
server pgrest3 127.0.0.1:8103 check
server pgrest4 127.0.0.1:8104 check
server pgrest5 127.0.0.1:8105 check
server pgrest6 127.0.0.1:8106 check
server pgrest7 127.0.0.1:8107 check
server pgrest8 127.0.0.1:8108 check
server pgrest9 127.0.0.1:8109 check
server pgrest10 127.0.0.1:8110 check
