[program:load_balancer]
command=/usr/sbin/haproxy -Ws -f /etc/botjagwar/haproxy.cfg -p /run/haproxy.pid -S /run/haproxy-master.sock
stdout_logfile=/var/lib/botjagwar/user_data/loadbalancer.log
stderr_logfile=/var/lib/botjagwar/user_data/loadbalancer_errors.log
autostart=true
startretries=10
user=root
stderr_logfile_maxbytes=100MB

[program:rmq_recentchanges]
