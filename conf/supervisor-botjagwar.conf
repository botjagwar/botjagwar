stdout_logfile=/var/lib/botjagwar/user_data/rmq_recentchanges_stdout.log
stderr_logfile=/var/lib/botjagwar/user_data/rmq_recentchanges_stderr.log
autostart=true
startretries=10
user=user
stderr_logfile_maxbytes=10MB

