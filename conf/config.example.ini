[global]

# Enable debug mode for development
debug = false

# SQLAlchemy database URI. This password-free local example assumes PostgreSQL
# peer or another externally managed authentication method. Add credentials
# only in the protected conf/config.ini copy, never in this example.
database_uri = postgresql+psycopg2://botjagwar@localhost:5432/botjagwar
# Optional: use a dedicated role that owns the materialized views.
# materialized_view_database_uri = postgresql://atlas_refresh@localhost:5432/botjagwar
# database_uri = mysql+pymysql://botjagwar@localhost:3306/botjagwar
# database_uri = sqlite:////opt/botjagwar/botjagwar.db

# PostgREST host:port used by backend services and rendered into the Atlas
# dashboard runtime configuration. When Atlas runs separately, set this to the
# Botjagwar backend host.
postgrest_backend_address = 127.0.0.1:8100
# Half-hour page-check score history defaults to the local translator and the
# Malagasy Wiktionary. Add comma-separated language codes when needed.
page_check_statistics_url = http://127.0.0.1:8000
page_check_statistics_languages = mg
gemini_api_key =
deepseek_api_key =
deepseek_model = deepseek-chat
# The page checker can instead use any OpenAI-compatible chat service. These
# values take precedence over the legacy DeepSeek settings above. For the local
# Gemma service installed by install-gemma.sh, uncomment all three lines.
# page_checker_model_api_url = http://127.0.0.1:8891/v1/chat/completions
# page_checker_model = gemma-4-e2b-it-q4-k-m
# page_checker_model_api_key =

[tenymalagasy]
# The page checker only accesses tenymalagasy.org through this local mirror.
mirror_url = http://127.0.0.1:8004
upstream_url = https://tenymalagasy.org
database_path = /opt/botjagwar/user_data/tenymalagasy_mirror.sqlite3

[redis]
host = localhost
password =

[wikimedia]
# One Redis-coordinated budget is shared by every Botjagwar process and wiki.
requests_per_minute = 60
max_wait_seconds = 30

# Keep Pywikibot retries and network waits finite. HTTP 403 responses are not
# retried by Botjagwar's wrapper.
max_retries = 2
retry_wait_seconds = 1
retry_max_seconds = 5
maxlag_seconds = 5
socket_connect_timeout_seconds = 5
socket_read_timeout_seconds = 30
user_agent_description = Botjagwar Wiktionary automation (https://mg.wiktionary.org/wiki/User:Bot-Jagwar)

[dictionary_service]
backend_address = localhost

[translator]
ninja_mode = 0

# Backend for the load balancer
backend_port = 8000

[openmt]
backend_address = http://localhost:8003

[nllb]
backend_address = localhost:8890
remaining_words_threshold = 4

[gemma]
# OpenAI-compatible Gemma endpoint used for page-check fixes and to simplify
# low-vocabulary English definitions.
api_url = http://127.0.0.1:8891/v1/chat/completions
model = gemma-4-e2b-it-q4-k-m
api_key =

[rabbitmq]
# AMQP broker used by publishers and consumers.
# The service and gateway settings are needed only by legacy HTTP publishers.
service =
host = 127.0.0.1
queue = botjagwar
page_check_queue = translated
page_check_review_queue = page-check-review
gateway_replay_ledger = /var/lib/botjagwar/user_data/rabbitmq-gateway-replays.sqlite3
gateway_hmac_secret =
username = botjagwar
password =
virtual_host = botjagwar

[wiktionary_review]
# Set this to a stable, unique deployment name such as mgwikt-production.
environment_id =
