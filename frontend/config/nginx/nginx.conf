worker_processes 1;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log logs/access.log;
    error_log logs/error.log;

    upstream atlas_postgrest {
        include /etc/botjagwar/nginx/postgrest-upstreams.conf;
    }

    upstream atlas_dictionary_service {
        include /etc/botjagwar/nginx/dictionary-service-upstreams.conf;
    }

    upstream atlas_entry_translator {
        include /etc/botjagwar/nginx/entry-translator-upstreams.conf;
    }

    upstream atlas_supervisor_control {
        include /etc/botjagwar/nginx/supervisor-control-upstreams.conf;
    }

    server {
        listen 38000 ssl;
        server_name _;
        root /opt/botjagwar/current/frontend;
        ssl_certificate /opt/botjagwar-certs/fullchain.pem;
        ssl_certificate_key /opt/botjagwar-certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:AtlasSSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        error_page 497 =301 https://$host:38000$request_uri;
        auth_basic "Botjagwar Atlas";
        auth_basic_user_file /etc/botjagwar/nginx/atlas.htpasswd;
        include /etc/botjagwar/supervisor-rpc-location.conf;

        location = / {
            try_files /index.html =404;
        }

        location /api/database/ {
            proxy_pass http://atlas_postgrest/;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization "";
        }

        location /api/dictionary/ {
            proxy_pass http://atlas_dictionary_service/;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization "";
        }

        location /api/translator/ {
            proxy_pass http://atlas_entry_translator/;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization "";
        }

        location /api/services/ {
            proxy_pass http://atlas_supervisor_control/;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 40s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Atlas-Authenticated $remote_user;
            proxy_set_header Authorization "";
            include /etc/botjagwar/supervisor-control-proxy.conf;
        }

        location /api/operations/ {
            proxy_pass http://atlas_supervisor_control/operations/;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Atlas-Authenticated $remote_user;
            proxy_set_header Authorization "";
            include /etc/botjagwar/supervisor-control-proxy.conf;
        }

        location /api/maintenance/ {
            proxy_pass http://atlas_supervisor_control/maintenance/;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Atlas-Authenticated $remote_user;
            proxy_set_header Authorization "";
            include /etc/botjagwar/supervisor-control-proxy.conf;
        }

        location /api/gemma/ {
            proxy_pass http://atlas_supervisor_control/gemma/;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 130s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Atlas-Authenticated $remote_user;
            proxy_set_header Authorization "";
            include /etc/botjagwar/supervisor-control-proxy.conf;
        }

        location ^~ /config/ {
            deny all;
        }

        location ^~ /logs/ {
            deny all;
        }

        location = /configure-atlas.sh {
            deny all;
        }

        location = /setup-tls.sh {
            deny all;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
